# O robô da aba Circuito do Only Tennis.
#
# A cada 15 minutos: busca a fonte, valida e publica public/latest.json no
# GitHub Pages. Duas proteções de experiência:
#  - validação reprovada = nada é publicado e o Pages segue com o último bom;
#  - dado idêntico ao que já está no ar = deploy dispensado (o selo
#    "atualizado há X" do app só anda quando há novidade de verdade).
name: build-feed
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.feed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      # O GitHub desliga crons de repositório parado ha 60 dias. Um commit
      # vazio mensal mantem o robo vivo para sempre.
      - name: heartbeat mensal
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 25 ]; then
            git config user.name "feed-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "chore: heartbeat para manter o cron vivo"
            git push
          fi
      - id: feed
        run: python3 build_feed.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.feed.outputs.changed == 'true'
        with:
          path: public
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
